name: Release exe

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-exe-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # 既存タグから Release を作る場合も、タグ名が v* のときだけ動かす
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: powered_by_golang/go.mod
          cache-dependency-path: powered_by_golang/go.sum

      - name: Generate Windows resources
        working-directory: powered_by_golang
        run: go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon ..\assets\schedule_manager.ico --manifest cli --product-name "schedule_manager" --file-description "schedule_manager" --original-filename schedule_manager.exe --out rsrc

      - name: Build exe
        working-directory: powered_by_golang
        env:
          CGO_ENABLED: "0"
        run: go build -o dist\schedule_manager.exe .

      - name: Check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "powered_by_golang\dist\schedule_manager.exe")) {
            throw "powered_by_golang\dist\schedule_manager.exe が見つかりません"
          }

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: powered_by_golang/dist/schedule_manager.exe
          fail_on_unmatched_files: true
